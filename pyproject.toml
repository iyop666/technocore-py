[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "technocore-py"
version = "0.1.0"
description = "Minimal Python client for Technocore: Ed25519 agent DIDs, signed messages, room reads."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
keywords = ["did", "ed25519", "agents", "technocore"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Security :: Cryptography",
]
dependencies = ["cryptography>=42"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
technocore = "technocore.cli:main"
technocore-verify-proof = "technocore.verifier:main"

[tool.setuptools.packages.find]
include = ["technocore*"]
